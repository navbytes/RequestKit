name: Create Release

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json' # version bumps land here
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the tag + GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the changelog compare link

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Validate localization
        run: npm run validate-messages

      - name: Build extension
        run: npm run build

      - name: Get version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' dist/manifest.json)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"

      - name: Check if release already exists
        id: existing
        run: |
          if gh release view "v${{ steps.version.outputs.VERSION }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.VERSION }} already exists — nothing to do."
          else
            echo "EXISTS=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release notes from CHANGELOG.md
        id: notes
        if: steps.existing.outputs.EXISTS == 'false'
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v version="$VERSION" '
              /^## \['"$VERSION"'\]/ { found=1; next }
              /^## \[/ { if (found) exit }
              { if (found) print }
            ' CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
            NOTES="See the full changelog: https://github.com/$GITHUB_REPOSITORY/compare/${PREV:-$(git rev-list --max-parents=0 HEAD)}...v$VERSION"
          fi
          {
            echo "NOTES<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Package store zip
        if: steps.existing.outputs.EXISTS == 'false'
        run: |
          cd dist
          zip -qr "../RequestKit_${{ steps.version.outputs.VERSION }}.zip" . -x '*.map' -x '*.DS_Store'
          cd ..
          ls -lh "RequestKit_${{ steps.version.outputs.VERSION }}.zip"

      - name: Create GitHub Release
        if: steps.existing.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: RequestKit v${{ steps.version.outputs.VERSION }}
          body: |
            ${{ steps.notes.outputs.NOTES }}

            ## Installation

            1. Download `RequestKit_${{ steps.version.outputs.VERSION }}.zip` below and extract it
            2. Open `chrome://extensions/`, enable **Developer mode**
            3. Click **Load unpacked** and select the extracted folder
          files: RequestKit_${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Chrome Web Store submission is deliberately NOT part of this
      # workflow — it is a manual, human-triggered step. Run the
      # "Publish to Chrome Web Store" workflow (publish-cws.yml) from the
      # Actions tab when ready to submit this release to the store.
      - name: Note manual store publish step
        if: steps.existing.outputs.EXISTS == 'false'
        run: |
          {
            echo "## Next step: Chrome Web Store"
            echo ""
            echo "Release v${{ steps.version.outputs.VERSION }} is on GitHub."
            echo "Store submission is manual: run the **Publish to Chrome Web Store**"
            echo "workflow from the Actions tab when ready."
          } >> "$GITHUB_STEP_SUMMARY"
