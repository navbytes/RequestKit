name: Publish to Chrome Web Store

# Manual-only by design: releasing to GitHub is automated, but submitting
# to the Chrome Web Store is a human decision. Trigger this from the
# Actions tab once a GitHub Release exists.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.0.3); empty = latest release'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Upload release zip to the store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Chrome Web Store credentials
        run: |
          missing=""
          [ -z "${{ secrets.CHROME_EXTENSION_ID }}" ] && missing="$missing CHROME_EXTENSION_ID"
          [ -z "${{ secrets.CHROME_CLIENT_ID }}" ] && missing="$missing CHROME_CLIENT_ID"
          [ -z "${{ secrets.CHROME_CLIENT_SECRET }}" ] && missing="$missing CHROME_CLIENT_SECRET"
          [ -z "${{ secrets.CHROME_REFRESH_TOKEN }}" ] && missing="$missing CHROME_REFRESH_TOKEN"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "See https://github.com/fregante/chrome-webstore-upload-cli#setup"
            exit 1
          fi

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing release: $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release zip
        run: |
          gh release download "${{ steps.tag.outputs.TAG }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'RequestKit_*.zip'
          ls -lh RequestKit_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Upload-only: the draft still has to be submitted for review from
      # the Chrome Web Store dashboard. Switch to `upload --auto-publish`
      # once a release cycle has gone through review cleanly.
      - name: Upload to Chrome Web Store
        run: npx chrome-webstore-upload-cli@3 upload --source RequestKit_*.zip
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
