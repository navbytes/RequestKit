name: Create Release

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json' # version bumps land here
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the tag + GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for the changelog compare link

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx vitest run

      - name: Validate localization
        run: npm run validate-messages

      - name: Build extension
        run: npm run build

      - name: Get version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' dist/manifest.json)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"

      - name: Check if release already exists
        id: existing
        run: |
          if gh release view "v${{ steps.version.outputs.VERSION }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "EXISTS=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.VERSION }} already exists — nothing to do."
          else
            echo "EXISTS=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release notes from CHANGELOG.md
        id: notes
        if: steps.existing.outputs.EXISTS == 'false'
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v version="$VERSION" '
              /^## \['"$VERSION"'\]/ { found=1; next }
              /^## \[/ { if (found) exit }
              { if (found) print }
            ' CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
            NOTES="See the full changelog: https://github.com/$GITHUB_REPOSITORY/compare/${PREV:-$(git rev-list --max-parents=0 HEAD)}...v$VERSION"
          fi
          {
            echo "NOTES<<NOTES_EOF"
            echo "$NOTES"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Package store zip
        if: steps.existing.outputs.EXISTS == 'false'
        run: |
          cd dist
          zip -qr "../RequestKit_${{ steps.version.outputs.VERSION }}.zip" . -x '*.map' -x '*.DS_Store'
          cd ..
          ls -lh "RequestKit_${{ steps.version.outputs.VERSION }}.zip"

      - name: Create GitHub Release
        if: steps.existing.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: RequestKit v${{ steps.version.outputs.VERSION }}
          body: |
            ${{ steps.notes.outputs.NOTES }}

            ## Installation

            1. Download `RequestKit_${{ steps.version.outputs.VERSION }}.zip` below and extract it
            2. Open `chrome://extensions/`, enable **Developer mode**
            3. Click **Load unpacked** and select the extracted folder
          files: RequestKit_${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Uploads the zip as a draft to the Chrome Web Store when the four
      # CWS secrets are configured; skips quietly otherwise. Deliberately
      # upload-only (no auto-publish): submit for review from the CWS
      # dashboard. Flip to `chrome-webstore-upload-cli upload --auto-publish`
      # once a release cycle has gone through review cleanly.
      - name: Check Chrome Web Store credentials
        id: cws
        if: steps.existing.outputs.EXISTS == 'false'
        run: |
          if [ -n "${{ secrets.CHROME_EXTENSION_ID }}" ] \
            && [ -n "${{ secrets.CHROME_CLIENT_ID }}" ] \
            && [ -n "${{ secrets.CHROME_CLIENT_SECRET }}" ] \
            && [ -n "${{ secrets.CHROME_REFRESH_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Chrome Web Store upload skipped"
              echo ""
              echo "Configure these repository secrets to enable automatic uploads:"
              echo '`CHROME_EXTENSION_ID`, `CHROME_CLIENT_ID`, `CHROME_CLIENT_SECRET`, `CHROME_REFRESH_TOKEN`'
              echo ""
              echo "See https://github.com/fregante/chrome-webstore-upload-cli#setup"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload to Chrome Web Store
        if: steps.existing.outputs.EXISTS == 'false' && steps.cws.outputs.configured == 'true'
        run: npx chrome-webstore-upload-cli@3 upload --source "RequestKit_${{ steps.version.outputs.VERSION }}.zip"
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
