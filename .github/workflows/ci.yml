name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run type-check

      - name: Security audit
        run: npm audit --audit-level=high

  test:
    name: Tests & Localization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: npx vitest run --coverage

      - name: Validate locale messages
        run: npm run validate-messages

      - name: Check for missing localization keys
        run: npm run check-missing-keys

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Validate manifest
        run: |
          jq empty dist/manifest.json
          for field in manifest_version name version; do
            jq -e ".${field}" dist/manifest.json > /dev/null \
              || { echo "manifest.json is missing required field: ${field}"; exit 1; }
          done
          [ "$(jq -r .manifest_version dist/manifest.json)" = "3" ] \
            || { echo "manifest_version must be 3"; exit 1; }
          [ -f dist/_locales/en/messages.json ] \
            || { echo "default locale messages missing from dist"; exit 1; }

      - name: Enforce bundle size budget
        run: |
          # Hard-fail on any single JS bundle over 1MB — well under store
          # limits, and a regression signal long before users feel it.
          oversized=$(find dist -name '*.js' -size +1M)
          if [ -n "$oversized" ]; then
            echo "JS bundles over the 1MB budget:"
            ls -lh $oversized
            exit 1
          fi

      - name: Package store zip
        run: |
          cd dist
          zip -qr ../requestkit.zip . -x '*.map' -x '*.DS_Store'
          cd ..
          if unzip -l requestkit.zip | grep -q '\.map$'; then
            echo "source maps must not ship in the store zip"
            exit 1
          fi
          size=$(stat -c%s requestkit.zip)
          echo "Store zip size: $((size / 1024)) KB"
          if [ "$size" -gt $((10 * 1024 * 1024)) ]; then
            echo "store zip exceeds the 10MB budget"
            exit 1
          fi

      - name: Upload extension artifact
        uses: actions/upload-artifact@v5
        with:
          name: requestkit-extension
          path: requestkit.zip
          retention-days: 14

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Forked PRs have no access to SONAR_TOKEN.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
